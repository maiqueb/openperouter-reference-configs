apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: dedicated-linux-nic-iface
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  desiredState:
    interfaces:
    - name: ens4
      type: ethernet
      state: up
      ipv4:
        enabled: false
      ipv6:
        enabled: false
    - ipv4:
        enabled: false
      ipv6:
        enabled: false
      name: ovsbr1
      state: up
      type: ovs-interface
    - bridge:
        allow-extra-patch-ports: true
        options:
          stp: false
        port:
        - name: ovsbr1
      name: ovsbr1
      state: up
      type: ovs-bridge
    ovn:
      bridge-mappings:
      - bridge: ovsbr1
        localnet: datanet
        state: present
