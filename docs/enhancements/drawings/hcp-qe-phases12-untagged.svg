vetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal">no VLAN tags 1000–1019</text><line x1="970" y1="286" x2="1160" y2="286" stroke="#e3b6ae" stroke-width="1" stroke-dasharray="3 3"/><text x="970" y="308" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">Four separate untagged L2</text><text x="970" y="328" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">domains, one per NIC. They</text><text x="970" y="348" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">isolate the NICs, but they are</text><text x="970" y="368" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">not the per-port tag slices of</text><text x="970" y="388" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">phase 3.</text><line x1="970" y1="414" x2="1160" y2="414" stroke="#e3b6ae" stroke-width="1" stroke-dasharray="3 3"/><text x="970" y="440" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b03a2e" text-anchor="start" font-weight="bold">phase 2: automation only</text><text x="970" y="470" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="start" font-weight="bold">·</text><text x="986" y="470" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">bridges created by an NNCP</text><text x="986" y="490" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">which also brings the bridge</text><text x="986" y="510" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">marker and safe scheduling</text><text x="970" y="532" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="start" font-weight="bold">·</text><text x="986" y="532" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">explicit MTU on the bridge</text><text x="986" y="552" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">and on all four NADs</text><text x="970" y="574" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="start" font-weight="bold">·</text><text x="986" y="574" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">framework VNI allocator</text><text x="970" y="596" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="start" font-weight="bold">·</text><text x="986" y="596" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">per-node readiness gates</text><text x="970" y="618" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="start" font-weight="bold">·</text><text x="986" y="618" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">teardown and label sweep</text><line x1="160" y1="400" x2="160" y2="496" stroke="#8a94a3" stroke-width="1.6"/><text x="170" y="436" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b7a" text-anchor="start" font-weight="normal">host veth 1</text><line x1="374" y1=