name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "hack/build-docs.sh"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Render AsciiDoc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Render guides to HTML
        run: bundle exec ./hack/build-docs.sh

      # Pages must be enabled once in Settings > Pages > Build and deployment
      # > Source: GitHub Actions. The workflow token cannot create the Pages
      # site itself, so do not pass `enablement: true` here.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
