log file /etc/frr/frr.log debugging

!
! L3VNI 100 fronting VRF red.
! The container entrypoint (hack/setup-frr-router-red-vrf.sh) creates the
! VRF, br100/vni100, and enslaves the external-client NIC (eth2 by default)
! to VRF red. The net1-ext NIC (eth1) stays in the default VRF for BGP.
! The external-client connected subnet is redistributed below.
!
vrf red
 vni 100
exit-vrf
!
router bgp 64512 vrf red
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
  ! own routes + routes exported by the OpenPERouter cluster (ASN 64514)
  route-target import 64512:100
  route-target import 64514:100
 exit-address-family
exit
!
router bgp 64512
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check

 neighbor ocp-nodes peer-group
 neighbor ocp-nodes remote-as 64514

 ! OpenPERouter nodes peer from the net1 underlay (net1-ext, 10.200.0.0/16).
 bgp listen range 10.200.0.0/16 peer-group ocp-nodes
 !
 address-family ipv4 unicast
  network 100.64.0.1/32
  neighbor ocp-nodes activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor ocp-nodes activate
  neighbor ocp-nodes allowas-in origin
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
