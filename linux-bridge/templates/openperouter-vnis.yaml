---
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: ${VRF}-${L3VNI}
spec:
  vrf: $VRF
  vni: $L3VNI
---
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: ${VRF}-${L2VNI}
spec:
  vni: $L2VNI
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      name: $L2VNI_BRIDGE
  gatewayIPs: ["$L2VNI_GW_CIDR"]
  routingDomain:
    type: L3VNI
    l3vni:
      name: ${VRF}-${L3VNI}
