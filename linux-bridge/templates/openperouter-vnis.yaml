---
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: ${VRF}-${L3VNI}
  namespace: $NAMESPACE
spec:
  vrf: $VRF
  vni: $L3VNI
---
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: ${VRF}-${L2VNI}
  namespace: $NAMESPACE
spec:
  vni: $L2VNI
  gatewayIPs:
    - $L2VNI_GW_CIDR
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: External
      name: $L2VNI_BRIDGE
  routingDomain:
    type: L3VNI
    l3vni:
      name: ${VRF}-${L3VNI}
