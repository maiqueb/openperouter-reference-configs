---
# One Underlay per node: the raw CNI config carries that node's own static
# address, and the macvlan is created by the CNI plugin inside the router
# netns. The host's node NIC is left untouched.
apiVersion: network.openperouter.io/v1alpha1
kind: Underlay
metadata:
  name: underlay-multi-homing-worker-0
  namespace: openshift-openperouter
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: multi-homing-worker-0.maiqueb.org
  asn: 64514
  tunnelEndpoint:
    cidrs:
      - 100.65.0.0/24
  neighbors:
    - asn: 64512
      address: 10.200.11.9
  interfaces:
    - type: CNIDevice
      cniDevice:
        type: RawConfig
        interfaceName: net1
        rawConfig:
          cniVersion: "1.0.0"
          name: macvlan-underlay
          plugins:
            - type: macvlan
              master: ens4
              mode: bridge
              ipam:
                type: static
                addresses:
                  - address: 10.200.11.50/16
---
