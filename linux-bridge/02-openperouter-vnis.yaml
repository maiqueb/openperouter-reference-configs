---
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: red-100
  namespace: openshift-openperouter
spec:
  vrf: red
  vni: 100
---
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: red-110
  namespace: openshift-openperouter
spec:
  vni: 110
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      name: brvni110
  gatewayIPs: ["192.170.1.1/24"]
  routingDomain:
    type: L3VNI
    l3vni:
      name: red-100
